<header class="h-16 flex items-center justify-between px-6 border-b border-ink-200 bg-white/80 backdrop-blur supports-[backdrop-filter]:bg-white/70 sticky top-0 z-20">
  <div class="text-sm font-medium text-ink-500">{% block topbar_title %}{% endblock %}</div>
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2.5">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-ink-100 text-ink-700 text-xs font-semibold ring-1 ring-inset ring-ink-200">
        {{ user.get_full_name|default:user.username|slice:":2"|upper }}
      </span>
      <span class="hidden sm:block text-sm font-medium text-ink-700">{{ user.get_full_name|default:user.username }}</span>
    </div>
    <span class="h-5 w-px bg-ink-200"></span>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="inline-flex items-center gap-1.5 text-sm text-ink-500 hover:text-ink-900 font-medium cursor-pointer transition-colors">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
        Sair
      </button>
    </form>
  </div>
</header>
