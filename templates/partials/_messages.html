{% if messages %}
<div class="space-y-3 mb-6">
  {% for message in messages %}
  <div class="flex items-start gap-3 rounded-xl border px-4 py-3.5 text-sm shadow-sm
    {% if message.tags == 'error' %} bg-red-50 border-red-200 text-red-800
    {% elif message.tags == 'success' %} bg-emerald-50 border-emerald-200 text-emerald-800
    {% elif message.tags == 'warning' %} bg-amber-50 border-amber-200 text-amber-800
    {% else %} bg-blue-50 border-blue-200 text-blue-800
    {% endif %}">
    <span class="mt-0.5 shrink-0">
      {% if message.tags == 'error' %}
      <svg class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
      {% elif message.tags == 'success' %}
      <svg class="h-5 w-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75l2.25 2.25 4.5-4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      {% elif message.tags == 'warning' %}
      <svg class="h-5 w-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
      {% else %}
      <svg class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>
      {% endif %}
    </span>
    <span class="pt-0.5">{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
