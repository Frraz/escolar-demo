# Config de referência para o nginx do HOST (não roda dentro de Docker).
#
# Instalar no servidor com:
#   sudo cp deploy/nginx/escolar-demo.ferzion.com.br.conf \
#     /etc/nginx/sites-available/escolar-demo.ferzion.com.br
#   sudo ln -s /etc/nginx/sites-available/escolar-demo.ferzion.com.br \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois rodar o certbot (ele edita este arquivo automaticamente e adiciona
# o bloco HTTPS/443 + redirecionamento — não adicione SSL manualmente antes):
#   sudo certbot --nginx -d escolar-demo.ferzion.com.br

server {
    listen 80;
    listen [::]:80;
    server_name escolar-demo.ferzion.com.br;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/docker-instances/escolar-demo/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
