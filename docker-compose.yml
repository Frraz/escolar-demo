services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escolar}
      POSTGRES_DB: ${POSTGRES_DB:-escolar_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-escolar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${WEB_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
